# Incident Desk: two agents across two linked rooms (releases + incidents).
#
# Switch Console creates the `agents:`. The server creates the room group
# from `group:`, `rooms:` and `links:`. The release-auditor sits in both rooms
# so it maintains the release ledger in `{team}-releases` and verifies suspect
# commits in `{team}-incidents`. The incident-triager sits in `{team}-incidents`,
# follows the link to `{team}-releases`, and maintains room-scoped incident timelines.
version: 1

params:
  team:
    type: string
    description: Service or team prefix for created agents and rooms
    default: payments
    pattern: "[a-z][a-z0-9-]*"
  provider:
    type: provider
    description: Coding agent backing both teammates
    default: [claude, codex, opencode]
    input: advanced
  location:
    type: location
    description: Machine both agents run on
    default: local
    input: advanced
  directory:
    type: directory
    description: Working directory per agent
    default: "{$agents_dir}/{agent}"
    input: advanced
  bridge:
    type: bridge
    description: Messaging app where both rooms are mirrored (Slack, Discord, Teams, Mattermost)
    default: [Slack, $first]

agents:
  - name: "{team}-incident-triager"
    description: Triages incoming alerts, correlates recent deploys across linked rooms, and maintains room-scoped incident timelines
    addressing: anyone
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    instructions: |
      You hold the `incident-commander` role in `{team}-incidents`.
      When an alert or bug report arrives:
      1. Follow the room link labeled `parent` to `{team}-releases` and read `release-ledger.md` plus recent deploy messages.
      2. Create or update a room-scoped document `incident-<id>.md` in `{team}-incidents` with the symptom, endpoint, and correlated commit SHA.
      3. Hand off commit verification in the same thread to `@regression-checker` with the exact SHA.
      4. When `@release-manager` confirms a rollback, update `incident-<id>.md` to `RESOLVED`.
  - name: "{team}-release-auditor"
    description: Owns the release ledger in {team}-releases and verifies suspect commits and human-gated rollbacks in {team}-incidents
    addressing: owner-agents
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    instructions: |
      You hold the exclusive `release-manager` role in `{team}-releases` and `regression-checker` in `{team}-incidents`.
      Never guess repository state from memory; check the attached repository reference and `release-ledger.md`.
      When `@incident-commander` hands you a suspect commit SHA:
      1. Inspect the diff and touched paths for that SHA.
      2. Post a concise verification summary and the exact revert command in the incident thread.
      3. Do not execute a rollback until an authorized operator in the room posts `@release-manager confirm rollback <sha>`.

group:
  name: "{team} operations"
  description: Release management and incident response rooms for {team}

rooms:
  - name: "{team}-releases"
    description: Day-to-day shipping, release ledger, and deploy gating for {team}
    bridge: "{bridge}"
    agents: ["{team}-release-auditor"]
    users: ["{$creator}"]
    kickoff: |
      @{team}-release-auditor assume the `release-manager` role in this room and
      initialize `release-ledger.md` if it does not exist yet.
  - name: "{team}-incidents"
    description: Production alerts, cross-room release correlation, and human-gated rollbacks for {team}
    bridge: "{bridge}"
    agents: ["{team}-incident-triager", "{team}-release-auditor"]
    users: ["{$creator}"]
    kickoff: |
      @{team}-incident-triager assume `incident-commander` and @{team}-release-auditor
      assume `regression-checker`. Confirm you can see the link to `{team}-releases`.

links:
  - from: "{team}-releases"
    to: "{team}-incidents"
    label: incidents
  - from: "{team}-incidents"
    to: "{team}-releases"
    label: parent
